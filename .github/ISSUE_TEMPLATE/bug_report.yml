name: Bug Report
description: Report a bug
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: Expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Do '...'
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. Docker image tag or commit hash
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - api
        - ingest
        - stream
        - webdav
        - stremio / addon
        - byos
        - deploy / self-hosting
        - other / not sure
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
