name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'image tag to deploy: latest, edge, or a version like v6.0.0'
        required: false
        default: latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull images on the box and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull --ff-only                      # refresh compose + config files only
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            export TORRIN_TAG="${{ github.event.inputs.tag }}"
            docker compose -f deploy/docker-compose.yml pull
            docker compose -f deploy/docker-compose.yml up -d
            docker image prune -f                   # drop the now-unused old images
